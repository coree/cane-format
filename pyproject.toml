[project]
name = "cane-format"
version = "0.1.0"
description = "Read, write and parse CANE, a natural-language output format for LLM-based named entity recognition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Cornelius" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "nlp",
    "ner",
    "named entity recognition",
    "information extraction",
    "llm",
    "annotation",
    "brat",
    "cane",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.scripts]
cane-format = "cane_format.cli:main"

[project.urls]
Documentation = "https://coree.github.io/cane-format/"
Repository = "https://github.com/coree/cane-format"
Issues = "https://github.com/coree/cane-format/issues"
Changelog = "https://github.com/coree/cane-format/blob/main/CHANGELOG.md"
Paper = "https://aclanthology.org/2026.findings-emnlp.1398/"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.13", "ruff>=0.8"]
docs = ["great-docs==0.17.0; python_version >= '3.11'"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cane_format"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
